<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="container-fluid bg-warning border border-dark p-2">

    <div class="row align-items-center">

        <div class="col-2">

            <img
                src="./school-college-vector-logo-design-template-graduate-student-pupil-FACTK8.jpg"
                class="img-fluid rounded-circle border border-dark"
                width="60"
                alt="School Logo">

        </div>

        <div class="col-8 text-center">

            <h2 class="fw-bold mb-0">
                Student Login
            </h2>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="fw-bold">
            Students
        </h1>

        <button
            type="button"
            class="btn btn-success"
            data-bs-toggle="modal"
            data-bs-target="#studentModal">

            Add Student

        </button>

    </div>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card h-100 shadow">

                <img
                    src="./man-with-glasses-and-headphones-logo-vector.jpg"
                    class="card-img-top"
                    style="height:250px; object-fit:contain;"
                    alt="Younas">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Younas
                    </h5>

                    <p class="card-text">
                        Batch Number 22
                    </p>

                    <a
                        href="younas.html"
                        class="btn btn-primary">

                        View Profile

                    </a>

                </div>

            </div>

        </div>



        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card h-100 shadow">

                <img
                    src="./6837225 (1).png"
                    class="card-img-top"
                    style="height:250px; object-fit:contain;"
                    alt="Ali">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Ali
                    </h5>

                    <p class="card-text">
                        Batch Number 23
                    </p>

                    <a
                        href="ali.html"
                        class="btn btn-primary">

                        View Profile

                    </a>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card h-100 shadow">

                <img
                    src="./images.png"
                    class="card-img-top"
                    style="height:250px; object-fit:contain;"
                    alt="Ahmed">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Ahmed
                    </h5>

                    <p class="card-text">
                        Batch Number 24
                    </p>

                    <a
                        href="ahmed.html"
                        class="btn btn-primary">

                        View Profile

                    </a>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card h-100 shadow">

                <img
                    src="./businessman-strategy-specialy-png.webp"
                    class="card-img-top"
                    style="height:250px; object-fit:contain;"
                    alt="Usman">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Usman
                    </h5>

                    <p class="card-text">
                        Batch Number 25
                    </p>

                    <a
                        href="usman.html"
                        class="btn btn-primary">

                        View Profile

                    </a>

                </div>

            </div>

        </div>


    </div>

</div>

<div
    class="modal fade"
    id="studentModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">



            <div class="modal-header">

                <h5 class="modal-title">
                    Add Student
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>



            <div class="modal-body">


                <div class="mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter Student Name">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        placeholder="Enter Age">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Batch Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter Batch Number">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Image URL
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter Image URL">

                </div>

            </div>



            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-success">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
