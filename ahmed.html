<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahmed Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="container-fluid bg-warning border border-dark p-2">

    <div class="row align-items-center">

        <div class="col-2">

            <img
                src="./school-college-vector-logo-design-template-graduate-student-pupil-FACTK8.jpg"
                class="img-fluid rounded-circle border border-dark"
                width="60"
            >

        </div>

        <div class="col-8 text-center">

            <h2 class="fw-bold mb-0">
                Student Profile
            </h2>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="row">
        <div class="col-md-3 text-center">

            <h4 class="mb-3">
                PROFILE
            </h4>

            <img
                src="./images.png"
                class="img-fluid rounded-circle border border-dark mb-3"
                style="width:200px;height:200px;object-fit:cover;"
            >

            <h3>
                Ahmed
            </h3>

            <p>
                Batch Number 24
            </p>

        </div>
        <div class="col-md-9">

            <ul class="nav nav-tabs">

                <li class="nav-item">

                    <button
                        class="nav-link active"
                        data-bs-toggle="tab"
                        data-bs-target="#assignment"
                    >
                        Assignments
                    </button>

                </li>

                <li class="nav-item">

                    <button
                        class="nav-link"
                        data-bs-toggle="tab"
                        data-bs-target="#quiz"
                    >
                        Quizzes
                    </button>

                </li>

                <li class="nav-item">

                    <button
                        class="nav-link"
                        data-bs-toggle="tab"
                        data-bs-target="#attendance"
                    >
                        Attendance
                    </button>

                </li>

            </ul>


            <div class="tab-content mt-4">
                <div
                    class="tab-pane fade show active"
                    id="assignment"
                >

                    <table class="table table-bordered table-striped">

                        <thead class="table-warning">

                            <tr>
                                <th>Title</th>
                                <th>Submitted Date</th>
                                <th>Topic</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr>
                                <td>Bootstrap Assignment 1</td>
                                <td>24 June</td>
                                <td>Bootstrap</td>
                            </tr>

                            <tr>
                                <td>Bootstrap Assignment 2</td>
                                <td>28 June</td>
                                <td>Grid</td>
                            </tr>

                            <tr>
                                <td>Bootstrap Assignment 3</td>
                                <td>3 July</td>
                                <td>Modal</td>
                            </tr>

                        </tbody>

                    </table>

                </div>
                <div
                    class="tab-pane fade"
                    id="quiz"
                >

                    <table class="table table-bordered table-striped">

                        <thead class="table-success">

                            <tr>
                                <th>Quiz</th>
                                <th>Marks</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr>
                                <td>HTML Quiz</td>
                                <td>17 / 20</td>
                                <td>Pass</td>
                            </tr>

                            <tr>
                                <td>CSS Quiz</td>
                                <td>18 / 20</td>
                                <td>Pass</td>
                            </tr>

                        </tbody>

                    </table>

                </div>
                <div
                    class="tab-pane fade"
                    id="attendance"
                >

                    <table class="table table-bordered table-striped">

                        <thead class="table-info">

                            <tr>
                                <th>Month</th>
                                <th>Present</th>
                                <th>Absent</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr>
                                <td>June</td>
                                <td>23</td>
                                <td>4</td>
                            </tr>

                            <tr>
                                <td>July</td>
                                <td>25</td>
                                <td>0</td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
